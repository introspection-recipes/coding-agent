# What this template asks for, and what it fills in.
#
# Order matters: a host prompts in this order, and a default may be written in
# terms of a variable declared before it.
version: 1
name: Coding agent
description: A starting point for your coding agent.

variables:
  - name: slug
    type: string
    prompt: Runtime slug
    # Also the manifest filename. The platform derives the Runtime group's
    # identity from `.introspection/<slug>.yaml`, not from `name:` inside it.

  - name: name
    type: string
    prompt: Display name
    default: "{{ slug }}"

  - name: description
    type: string
    prompt: One line describing the agent
    default: A starting point for your coding agent.

  - name: model
    type: choice
    prompt: Model
    choices:
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-4-1
      - anthropic/claude-haiku-4-5
    default: anthropic/claude-sonnet-4-6
