# Every combination anyone can ask for, rendered and checked in CI.
#
# The template itself is not a valid Recipe and never will be — its manifest
# filename is a token until it is rendered. So what has to be proved is that
# its *output* is valid, which is what this file enumerates.
cases:
  - name: defaults
    variables:
      slug: test-agent

  - name: every variable supplied
    variables:
      slug: review-bot
      name: Review Bot
      description: Reviews pull requests and suggests changes.
      model: anthropic/claude-opus-4-1
